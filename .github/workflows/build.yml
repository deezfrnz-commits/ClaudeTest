name: Build APK

on:
  push:
    paths-ignore:
      - 'TypeFacilitator/**'
      - '.github/workflows/typefacilitator.yml'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests (document engine)
        run: ./gradlew :core:test --console=plain
      - name: Assemble APKs
        run: ./gradlew :app:assembleDebug :app:assembleRelease --console=plain
      - name: APK sizes
        run: ls -la app/build/outputs/apk/*/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: DocumentFacilitator-apk
          path: app/build/outputs/apk/**/*.apk

  emulator-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --console=plain
      - name: Install checkers for exported files
        run: pip install pypdf python-docx openpyxl
      - name: Run on emulator (Android 14, Pixel 6)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./scripts/emulator-smoke.sh; s=$?; python3 scripts/ui_test.py; u=$?; echo "smoke=$s ui=$u"; exit $((s + u))
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-screenshots
          path: emulator-out/
