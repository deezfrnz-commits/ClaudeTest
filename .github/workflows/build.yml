name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests (document engine)
        run: ./gradlew :core:test --console=plain
      - name: Assemble APKs
        run: ./gradlew :app:assembleDebug :app:assembleRelease --console=plain
      - name: APK sizes
        run: ls -la app/build/outputs/apk/*/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: DocumentFacilitator-apk
          path: app/build/outputs/apk/**/*.apk
